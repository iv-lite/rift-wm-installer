# Rift config — niri-like scrolling strip, Cmd+Option-key shortcuts (matches
# the muscle memory from this repo's previous Paneru setup), native menu-bar
# workspace indicators, JankyBorders for the active-window border.
# Generated by rift-wm-installer. Edit freely; hot reload is on
# (`Cmd+Alt+Shift+R`, or automatic on save).
#
# Base recovered from this repo's git history (commit 45a3d75, the last
# working Rift-era config before the Paneru switch) and re-checked against
# https://acsandmann.github.io/rift-docs/reference/configuration/ (schema
# v0.5.8.1). If a key here errors on load, check that page for the current
# syntax — `rift-cli execute config reload` prints parse errors.

[settings]
# ─── Animations ───
animate = true
animation_duration = 0.3
animation_fps = 120.0

# ─── Mouse/Focus behavior — matches the current Paneru setup (focus follows
# the mouse; keyboard navigation warps the cursor to the focused window) ───
focus_follows_mouse = true
mouse_follows_focus = true
mouse_hides_on_focus = false

# Prevent these apps from stealing focus / triggering workspace switches
auto_focus_blacklist = [
  "com.apple.dock",
  "com.apple.systemuiserver",
  "com.apple.SecurityAgent",
  "com.apple.Spotlight",
]

# ─── Config hot reload ───
hot_reload = true

# Manage every macOS Space automatically (multi-monitor: no Option+Z per Space).
default_disable = false

[settings.layout]
# niri-style scrollable columns (matches Paneru's sliding-strip layout)
mode = "scrolling"
window_insertion_point = "end_of_tree"

[settings.layout.scrolling]
column_width_ratio = 1.0
min_column_width_ratio = 0.3
max_column_width_ratio = 1.0
alignment = "center"
focus_navigation_style = "niri"
animate = true

[settings.layout.scrolling.gestures]
enabled = true
invert_horizontal = false
fingers = 3
propagate_to_workspace_swipe = true

[settings.layout.gaps]
[settings.layout.gaps.outer]
top = 15
left = 15
bottom = 15
right = 15

[settings.layout.gaps.inner]
horizontal = 8
vertical = 8

# Per-display gap overrides (optional, multi-monitor).
# Get your display UUIDs with:  rift-cli query displays
# [settings.layout.gaps.per_display."<display-uuid>".outer]
#   top = 8
#   left = 8
#   bottom = 8
#   right = 8

# ─── Native menu-bar workspace indicators (replaces a bar app) ───
[settings.ui.menu_bar]
enabled = true
show_empty = false
mode = "all"
active_label = "index"
display_style = "label"

[settings.gestures]
enabled = true
consume_dock_swipe = true
skip_empty = true
fingers = 3
haptics_enabled = true

[settings.window_snapping]
drag_swap_fraction = 0.3

# ─── Virtual workspaces ───
# Rift workspaces are a fixed, named set (no on-demand creation/reaping like
# Paneru's dynamic rows) — 9 numbered workspaces, closest match to the old
# Rift-era default and to Paneru's Ctrl+Option+Up/Down lane below.
[virtual_workspaces]
enabled = true
default_workspace_count = 9
auto_assign_windows = true
preserve_focus_per_workspace = true
workspace_auto_back_and_forth = false
prevent_wrapping = false
reapply_app_rules_on_title_change = false

workspace_names = [
  "1", "2", "3", "4", "5", "6", "7", "8", "9"
]

# ─── App rules (same intent as Paneru's `windows.calculator`/`windows.preferences`) ───
# Nested under virtual_workspaces per the current schema (each `[[...]]`
# below appends one table to `virtual_workspaces.app_rules`).
[[virtual_workspaces.app_rules]]
app_id = "com.apple.calculator"
floating = true
size = { w = 360, h = 480 }

[[virtual_workspaces.app_rules]]
app_name = "System Settings"
floating = true

[[virtual_workspaces.app_rules]]
title_substring = "Preferences"
floating = true

# ─── Modifier lanes, named to mirror Paneru's current scheme ───
[modifier_combinations]
main       = "Meta + Alt"           # Cmd+Option: window focus/state/columns
mainShift  = "Meta + Alt + Shift"   # Cmd+Option+Shift: move window
disp       = "Meta + Ctrl"          # Cmd+Ctrl: displays
dispShift  = "Meta + Ctrl + Shift"  # Cmd+Ctrl+Shift: move window to display
mouseDisp  = "Meta + Ctrl + Alt"    # Cmd+Ctrl+Option: warp mouse to display only
ws         = "Ctrl + Alt"           # Ctrl+Option: workspaces
wsShift    = "Ctrl + Alt + Shift"   # Ctrl+Option+Shift: move window to workspace

[keys]
# ─── Window focus (Cmd+Option+Arrows) ───
"main + Left"  = { move_focus = "left" }
"main + Right" = { move_focus = "right" }
"main + Up"    = { move_focus = "up" }
"main + Down"  = { move_focus = "down" }

# ─── Move window / swap (Cmd+Option+Shift+Arrows) ───
"mainShift + Left"  = { move_node = "left" }
"mainShift + Right" = { move_node = "right" }
"mainShift + Up"    = { move_node = "up" }
"mainShift + Down"  = { move_node = "down" }

# ─── Column width (Cmd+Option+W) — matches Paneru's preset_column_widths ───
# Neither `resize_window_grow`/`resize_window_shrink` (named mode only, no
# numeric amount) nor a plain `resize-by <fixed amount>` land on Paneru's
# 0.3/0.5/1.0 presets (they're unevenly spaced). `cycle-column-width`
# (recovered from this repo's pre-Paneru history, scripts/cycle-column-width)
# measures the focused column's exact current width via `rift-cli query
# layout` and resizes by the precise delta to the next/previous preset.
"main + W"      = { exec = ["/bin/bash", "-c", "$HOME/.config/rift/cycle-column-width next"] }
"mainShift + W" = { exec = ["/bin/bash", "-c", "$HOME/.config/rift/cycle-column-width prev"] }
# Paneru's dedicated "jump to full width" (Cmd+Option+M), staying tiled.
# `toggle_fullscreen`/`toggle_fullscreen_within_gaps` also float the window
# (undocumented side effect) — this reuses the same resize-by mechanism as
# W/Shift+W instead, which never touches floating state.
"main + M" = { exec = ["/bin/bash", "-c", "$HOME/.config/rift/cycle-column-width max"] }

# ─── Workspaces (Ctrl+Option+Up/Down) ───
# Rift workspaces are fixed/numbered, not dynamic rows, so this cycles
# through the 9 fixed workspaces via the CLI instead of a native `[keys]`
# next/prev action (none is documented as of v0.5.8.1 — if one exists,
# prefer it here, e.g. { switch_workspace = "next" }).
"ws + Up"        = { exec = ["/bin/bash", "-c", "rift-cli execute workspace prev"] }
"ws + Down"      = { exec = ["/bin/bash", "-c", "rift-cli execute workspace next"] }
"main + Tab"     = "switch_to_last_workspace"

# Direct numbered jumps (reliable native fallback for the cycle above)
"main + 1" = { switch_to_workspace = 0 }
"main + 2" = { switch_to_workspace = 1 }
"main + 3" = { switch_to_workspace = 2 }
"main + 4" = { switch_to_workspace = 3 }
"main + 5" = { switch_to_workspace = 4 }
"main + 6" = { switch_to_workspace = 5 }
"main + 7" = { switch_to_workspace = 6 }
"main + 8" = { switch_to_workspace = 7 }
"main + 9" = { switch_to_workspace = 8 }

"mainShift + 1" = { move_window_to_workspace = 0 }
"mainShift + 2" = { move_window_to_workspace = 1 }
"mainShift + 3" = { move_window_to_workspace = 2 }
"mainShift + 4" = { move_window_to_workspace = 3 }
"mainShift + 5" = { move_window_to_workspace = 4 }
"mainShift + 6" = { move_window_to_workspace = 5 }
"mainShift + 7" = { move_window_to_workspace = 6 }
"mainShift + 8" = { move_window_to_workspace = 7 }
"mainShift + 9" = { move_window_to_workspace = 8 }

# ─── Displays (Cmd+Ctrl+Arrows) — native in Rift, no helper binaries needed ───
"disp + Left"  = { focus_display = "left" }
"disp + Right" = { focus_display = "right" }
"disp + Up"    = { focus_display = "up" }
"disp + Down"  = { focus_display = "down" }

"dispShift + Left"  = { move_window_to_display = { selector = "left" } }
"dispShift + Right" = { move_window_to_display = { selector = "right" } }
"dispShift + Up"    = { move_window_to_display = { selector = "up" } }
"dispShift + Down"  = { move_window_to_display = { selector = "down" } }

# Warp only the mouse pointer to a display, without changing window focus —
# Rift has no automatic edge-crossing warp (unlike Paneru's
# `horizontal_mouse_warp`), so this hotkey is the explicit substitute.
# Direction is resolved against the macOS arrangement (see README), not
# physical monitor placement.
"mouseDisp + Left"  = { move_mouse_to_display = "left" }
"mouseDisp + Right" = { move_mouse_to_display = "right" }
"mouseDisp + Up"    = { move_mouse_to_display = "up" }
"mouseDisp + Down"  = { move_mouse_to_display = "down" }

# ─── Window state ───
"main + V" = "toggle_window_floating"
"main + O" = "toggle_stack"
"main + Space" = "center_selection"
"main + Ctrl + E" = "unjoin_windows"
"main + Slash" = "toggle_orientation"

# ─── Apps ───
"disp + T" = { exec = ["/bin/bash", "-c", "open -a Ghostty"] }

# ─── Shortcut cheat sheet (Cmd+Shift+?) ───
"Meta + Shift + Comma" = { exec = ["/bin/bash", "-c", "~/.config/mac-scrolling-wm/helpers/display-shortcuts"] }

# ─── Misc ───
"mainShift + R" = "reload_config"
"mainShift + D" = "debug"
